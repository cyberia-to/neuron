[package]
name = "neuron-node"
version.workspace = true
edition.workspace = true
license-file.workspace = true
[dependencies]
neuron-model.workspace = true
neuron-engine.workspace = true
neuron-rune.workspace = true
cybergraph.workspace = true
mudra = { package = "cyber-mudra", path = "../../mudra", default-features = false }
inf-source = { path = "../../inf/rs/source", optional = true }
inf-value = { path = "../../inf/rs/value", optional = true }

[features]
query = ["dep:inf-source", "dep:inf-value"]
legacy-redb-migration = ["cybergraph/legacy-redb-migration"]
