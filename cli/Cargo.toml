[package]
name = "neuron-cli"
version.workspace = true
edition.workspace = true
license-file.workspace = true
[[bin]]
name = "neuron"
path = "src/main.rs"
[dependencies]
neuron-model.workspace = true
neuron-engine.workspace = true
neuron-node.workspace = true
neuron-rune.workspace = true
getrandom = "0.3"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
mudra = { package = "cyber-mudra", path = "../../mudra", default-features = false }

[features]
legacy-redb-migration = ["neuron-node/legacy-redb-migration"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
